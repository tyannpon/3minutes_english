<html lang="ja">
<head>
<meta charset="utf-8">

<title>英語暗記スライド（グループ練習）</title>
<style>
:root{--bg:#f4f6f8;--fg:#17212b;--mute:#6b7886;--line:#d5dce3;--ans:#0a6a8a;--blank:#a3adb8;--btn:#e4e9ee;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171e;--fg:#e8edf2;--mute:#8d9aa7;--line:#2b3641;--ans:#6fcbe6;--blank:#56626e;--btn:#1d2731}}
:root[data-theme="dark"]{--bg:#10171e;--fg:#e8edf2;--mute:#8d9aa7;--line:#2b3641;--ans:#6fcbe6;--blank:#56626e;--btn:#1d2731}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP","Meiryo",system-ui,sans-serif;display:flex;flex-direction:column;line-height:1.5}
header,footer{display:flex;flex-wrap:wrap;gap:.6rem 1.25rem;align-items:center;justify-content:space-between;padding:.8rem clamp(1rem,4vw,3rem);color:var(--mute);font-size:.9rem}
.bar{height:3px;background:var(--line)}.bar>i{display:block;height:100%;width:0;background:var(--ans)}
main{flex:1;display:flex;align-items:center;padding:1rem clamp(1rem,3vw,3rem);min-height:0;overflow:auto;position:relative}
#wrap{width:100%}
#row{display:flex;flex-direction:column;align-items:flex-start;gap:.5em;width:100%;text-align:left}
#row>span{white-space:nowrap;width:max-content;max-width:none}
#row>span.wrapmode{white-space:normal;width:100%}
.num{color:var(--mute);font-size:1.5rem;font-variant-numeric:tabular-nums}
.pic{line-height:0}.pic[hidden]{display:none}.pic svg{display:block;height:min(30vh,210px);width:auto;max-width:100%}
.jp{font-weight:500}
.en{font-weight:600;color:var(--ans)}
.en.blank{color:var(--blank);font-weight:400;letter-spacing:.04em}
#start{position:absolute;inset:0;display:flex;flex-direction:column;gap:1rem;align-items:flex-start;justify-content:center;padding:1rem clamp(1rem,3vw,3rem);background:var(--bg);font-size:1.1rem}
#start[hidden]{display:none}
button,input,select{font:inherit;color:var(--fg);background:var(--btn);border:1px solid var(--line);border-radius:6px;padding:.4rem .8rem;max-width:100%}
button{cursor:pointer}button:hover{border-color:var(--ans)}
input{width:6rem}
details{flex:1 1 100%}summary{cursor:pointer}
.set{display:flex;flex-wrap:wrap;gap:.6rem 1rem;margin-top:.5rem}
:focus-visible{outline:2px solid var(--ans);outline-offset:2px}
.msg{min-height:1.2em}
</style>
</head>

<div class="bar"><i id="prog"></i></div>
<main>
 <div id="wrap"><div id="row" aria-live="polite"><span class="num" id="num"></span><span class="pic" id="pic" hidden></span><span class="jp" id="jp"></span><span class="en blank" id="en"></span></div></div>

</main>
<footer>
 <span class="msg" id="msg"></span>
 <span><button id="mute" type="button">音声：オン</button> <button id="up" type="button">前へ</button> <button id="down" type="button">次へ</button></span>

</footer>

 it’s cheap."],["4909","家に着いたら電話するね","I’ll call you when I get home."],["4910","終わったら言うよ","I’ll tell you when it’s done."],["4911","明日会った時に全部説明するね","I’ll explain everything when I see you tomorrow."],["4912","そのニュースを聞いた時はショックだったよ","I was shocked when I heard the news."],["4913","話す前に考えてね","Think before you speak."],["4914","寝る前にいつも歯をみがくよ","I always brush my teeth before I go to bed."],["4915","行く前にスマホを充電しないと","I need to charge my phone before we go."],["4916","確認したら知らせるね","I’ll let you know after I check."],["4917","君のメッセージを受け取った後に彼と話したんだ","I talked to him after I got your message."],["4918","仕事が終わってから飲みに行ったんだ","We went for drinks after we finished work."],["5001","もっとお金があったら車を買ってるよ","If I had more money, I’d buy a car."],["5002","車があったら車で通勤してるよ","If I had a car, I’d drive to work."],["5003","100万ドルあったら仕事を辞めてるよ","If I had a million dollars, I’d quit my job."],["5004","選べるならこれにするかな","If I could choose, I’d pick this one."],["5005","行けるなら行ってるよ","If I could go, I would."],["5006","もっと長くいられるなら長くいるのに","If I could stay longer, I would."],["5007","真実を知ってたら君に言ってるよ","If I knew the truth, I’d tell you."],["5008","直し方を知ってたら手伝うんだけどな","If I knew how to fix it, I’d help."],["5009","彼女と知り合いだったら君に紹介してるよ","If I knew her, I’d introduce you."],["5010","私なら彼と話すかな","If I were you, I’d talk to him."],["5011","私なら一旦休むかな","If I were you, I’d take a break."],["5012","私なら助けを求めるかな","If I were you, I’d ask for help."],["5013","雨さえ止んでくれれば","If only it would stop raining."],["5014","今すぐ君に会えたらな","If only I could see you now."],["5015","時間さえ巻き戻せたらな","If only I could turn back time."],["50ex01","雨が止んでくれたらいいのにな","I wish it would stop raining."],["50ex02","今すぐ君に会えたらいいのにな","I wish I could see you now."]]</script>

join=\"round\"/><path d=\"M234.5 46 H253.5 L252 64 H236Z\" fill=\"#8ec5e8\"/><path d=\"M264 28.2 L266.34 33.66 L271.8 36 L266.34 38.34 L264 43.8 L261.66 38.34 L256.2 36 L261.66 33.66Z\" fill=\"#f7c948\"/><\/g><\/svg>","07ex03":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 200\" role=\"img\" aria-label=\"静かなカフェを探す二人\"><rect width=\"300\" height=\"200\" rx=\"18\" fill=\"#e8f1f7\"/><rect y=\"176\" width=\"300\" height=\"24\" fill=\"#d4e4ee\"/><g transform=\"translate(-16.0,56.0) scale(0.72)\"><rect x=\"138\" y=\"118\" width=\"24\" height=\"26\" rx=\"0\" fill=\"#e3b88e\"/><path d=\"M88 200 Q88 146 150 140 Q212 146 212 200Z\" fill=\"#3d7ea6\"/><path d=\"M134 140 L150 156 L166 140Z\" fill=\"#f2c9a0\"/><circle cx=\"112\" cy=\"98\" r=\"7\" fill=\"#f2c9a0\"/><circle cx=\"188\" cy=\"98\" r=\"7\" fill=\"#f2c9a0\"/><circle cx=\"150\" cy=\"95\" r=\"38\" fill=\"#f2c9a0\"/><path d=\"M111 90 Q108 52 150 52 Q192 52 189 90 Q178 68 150 70 Q122 68 111 90Z\" fill=\"#3b2a20\"/><circle cx=\"137\" cy=\"99\" r=\"3.6\" fill=\"#2a2a2a\"/><circle cx=\"163\" cy=\"99\" r=\"3.6\" fill=\"#2a2a2a\"/><path d=\"M138 112 Q150 125 162 112\" fill=\"none\" stroke=\"#2a2a2a\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"128\" cy=\"109\" r=\"5\" fill=\"#f0a58f\" opacity=\"0.55\"/><circle cx=\"172\" cy=\"109\" r=\"5\" fill=\"#f0a58f\" opacity=\"0.55\"/><line x1=\"196\" y1=\"166\" x2=\"222\" y2=\"150\" stroke=\"#3d7ea6\" stroke-width=\"22\" stroke-linecap=\"round\"/><circle cx=\"232\" cy=\"130\" r=\"15\" fill=\"#dfeef7\" stroke=\"#6b8799\" stroke-width=\"4\"/><line x1=\"243\" y1=\"141\" x2=\"254\" y2=\"152\" stroke=\"#6b8799\" stroke-width=\"5\" stroke-linecap=\"round\"/><circle cx=\"226\" cy=\"152\" r=\"11\" fill=\"#f2c9a0\"/><\/g><g transform=\"translate(74.0,56.0) scale(0.72)\"><path d=\"M108 92 Q104 50 150 50 Q196 50 192 92 L195 152 Q150 163 105 152Z\" fill=\"#6b3f2a\"/><rect x=\"138\" y=\"118\" width=\"24\" height=\"26\" rx=\"0\" fill=\"#e3b88e\"/><path d=\"M88 200 Q88 146 150 140 Q212 146 212 200Z\" fill=\"#e0883e\"/><path d=\"M134 140 L150 156 L166 140Z\" fill=\"#f2c9a0\"/><circle cx=\"112\" cy=\"98\" r=\"7\" fill=\"#f2c9a0\"/><circle cx=\"188\" cy=\"98\" r=\"7\" fill=\"#f2c9a0\"/><circle cx=\"150\" cy=\"95\" r=\"38\" fill=\"#f2c9a0\"/><path d=\"M111 90 Q108 52 150 52 Q192 52 189 90 Q178 68 150 70 Q122 68 111 90Z\" fill=\"#6b3f2a\"/><circle cx=\"137\" cy=\"99\" r=\"3.6\" fill=\"#2a2a2a\"/><circle cx=\"163\" cy=\"99\" r=\"3.6\" fill=\"#2a2a2a\"/><path d=\"M138 112 Q150 125 162 112\" fill=\"none\" stroke=\"#2a2a2a\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"128\" cy=\"109\" r=\"5\" fill=\"#f0a58f\" opacity=\"0.55\"/><circle cx=\"172\" cy=\"109\" r=\"5\" fill=\"#f0a58f\" opacity=\"0.55\"/><\/g><g transform=\"translate(-102 -20.4) scale(1.4)\"><rect x=\"208\" y=\"26\" width=\"72\" height=\"46\" rx=\"16\" fill=\"#fff\" stroke=\"#9db4c4\" stroke-width=\"2.5\"/><path d=\"M226 70 L220 90 L240 72Z\" fill=\"#fff\" stroke=\"#9db4c4\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><rect x=\"226\" y=\"62\" width=\"16\" height=\"9\" fill=\"#fff\"/><g transform=\"translate(-10 0)\"><rect x=\"234\" y=\"40\" width=\"22\" height=\"22\" rx=\"5\" fill=\"#fff\" stroke=\"#9db4c4\" stroke-width=\"2\"/><path d=\"M256 46 Q266 46 266 53 Q266 59 256 58\" fill=\"none\" stroke=\"#9db4c4\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M240 36 Q237 30 241 26 M249 36 Q246 30 250 26\" fill=\"none\" stroke=\"#b9c6d0\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/g><g transform=\"translate(6 6) scale(.9)\"><circle cx=\"252\" cy=\"46\" r=\"10\" fill=\"none\" stroke=\"#6b8799\" stroke-width=\"3.5\"/><line x1=\"259\" y1=\"53\" x2=\"266\" y2=\"60\" stroke=\"#6b8799\" stroke-width=\"4\" stroke-linecap=\"round\"/><\/g><\/g><\/svg>"};
const G={};ALL.forEach(r=>{(G[r[0].slice(0,2)]=G[r[0].slice(0,2)]||[]).push(r)});
const GK=Object.keys(G).sort();
const syn=("speechSynthesis" in window)?window.speechSynthesis:null;
let voices=[],g=GK[0],i=0,s=0,round=1,started=false,muted=false,token=0;
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
{const v=store.get("memo-pos3");if(v&&G[v.g]){g=v.g;i=Math.min(v.i||0,G[v.g].length-1)}}
$("grp").innerHTML=GK.map(k=>"<option value=\""+k+"\">"+k+"（"+G[k].length+"問）</option>").join("");
$("grp").value=g;
function score(v,p){const n=v.name.toLowerCase();let c=0;
 if(/natural|neural/.test(n))c+=6;if(/premium|enhanced|siri/.test(n))c+=5;if(/online/.test(n))c+=3;if(/google/.test(n))c+=2;
 if(v.localService===false)c+=1;if(/compact/.test(n))c-=3;if(p==="en"&&/en[-_]US/i.test(v.lang))c+=2;return c}
function fill(sel,p,key){
 const list=voices.filter(v=>v.lang&&v.lang.slice(0,2)===p).sort((a,b)=>score(b,p)-score(a,p));
 const saved=store.get(key);
 sel.innerHTML=list.map(v=>"<option value=\""+v.name.replace(/"/g,"")+"\">"+v.name+"</option>").join("");
 if(!list.length){sel.innerHTML="<option value=\"\">（この端末には声がありません）</option>";return}
 const ok=list.find(v=>v.name.replace(/"/g,"")===saved);
 sel.value=ok?saved:list[0].name.replace(/"/g,"");
}
function loadV(){voices=syn?syn.getVoices():[];fill($("vja"),"ja","memo-vja");fill($("ven"),"en","memo-ven")}
if(syn){loadV();syn.onvoiceschanged=loadV}
$("vja").addEventListener("change",()=>{store.set("memo-vja",$("vja").value);speakState()});
$("ven").addEventListener("change",()=>{store.set("memo-ven",$("ven").value);speakState()});
$("rate").addEventListener("change",speakState);
{const r=store.get("memo-rate");if(r){$("rate").value=r}}
$("rate").addEventListener("change",()=>store.set("memo-rate",$("rate").value));
function voiceFor(sel){return voices.find(v=>v.name.replace(/"/g,"")===sel.value)}
function say(text,lang,sel,rate){return new Promise(res=>{const u=new SpeechSynthesisUtterance(text);u.lang=lang;const v=voiceFor(sel);if(v){u.voice=v;u.lang=v.lang}u.rate=rate;u.onend=res;u.onerror=res;syn.speak(u)})}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function speakState(){
 const my=++token;
 if(!syn)return;
 syn.cancel();
 if(muted||!started)return;
 await wait(150);
 if(my!==token)return;
 const r=G[g][i],rate=parseFloat($("rate").value);
 if(!s){await say(r[1].replace(/ \/ /g,"、"),"ja-JP",$("vja"),Math.min(rate+0.1,1.1))}
 else{while(my===token&&!muted){await say(r[2].replace(/ \/ /g,". "),"en-US",$("ven"),rate);if(my!==token)break;await wait(900)}}
}
function fitEl(el,max,min){
 el.classList.remove("wrapmode");let f=max;el.style.fontSize=f+"px";const w=$("wrap").clientWidth;
 while(el.offsetWidth>w&&f>min){f--;el.style.fontSize=f+"px"}
 if(el.offsetWidth>w)el.classList.add("wrapmode");
}
function fit(){fitEl($("jp"),44,16);fitEl($("en"),50,16)}
function render(speak){
 const L=G[g],r=L[i];
 $("num").textContent=r[0];$("jp").textContent=r[1];
 {const p=$("pic");if(IMG[r[0]]){p.innerHTML=IMG[r[0]];p.hidden=false}else{p.innerHTML="";p.hidden=true}}
 const e=$("en");
 if(s){e.textContent=r[2];e.classList.remove("blank")}else{e.textContent="_________.";e.classList.add("blank")}
 $("cnt").textContent=(i+1)+" / "+L.length+"　"+round+"周目";
 $("prog").style.width=((i+1)/L.length*100)+"%";
 store.set("memo-pos3",{g:g,i:i});
 fit();if(speak!==false)speakState();
}
function begin(){started=true;$("start").hidden=true;s=0;render()}
function next(){if(!started){begin();return}const n=G[g].length;if(!s){s=1}else{i++;s=0;if(i>=n){i=0;round++}}render()}
function prev(){if(!started){begin();return}const n=G[g].length;if(s){s=0}else{i--;s=1;if(i<0){i=n-1;round=Math.max(1,round-1)}}render()}
document.addEventListener("keydown",ev=>{
 const t=ev.target&&ev.target.tagName;if(t==="INPUT"||t==="SELECT")return;
 if(ev.key==="ArrowDown"){ev.preventDefault();next()}
 else if(ev.key==="ArrowUp"){ev.preventDefault();prev()}
});
$("down").addEventListener("click",next);$("up").addEventListener("click",prev);
$("startbtn").addEventListener("click",begin);
$("mute").addEventListener("click",()=>{muted=!muted;$("mute").textContent=muted?"音声：オフ":"音声：オン";speakState()});
$("grp").addEventListener("change",ev=>{g=ev.target.value;i=0;s=0;round=1;ev.target.blur();render()});
$("jump").addEventListener("keydown",ev=>{
 if(ev.key!=="Enter")return;
 const q=ev.target.value.trim().toLowerCase();
 const k=ALL.find(r=>r[0].toLowerCase()===q);
 if(!k){$("msg").textContent="見つかりません："+q;return}
 $("msg").textContent="";g=k[0].slice(0,2);$("grp").value=g;i=G[g].indexOf(k);s=0;round=1;ev.target.value="";ev.target.blur();started=true;$("start").hidden=true;render();
});
document.addEventListener("visibilitychange",()=>{if(document.hidden){token++;if(syn)syn.cancel()}else if(started){speakState()}});
window.addEventListener("resize",fit);
if(!syn)$("msg").textContent="このブラウザは音声読み上げに対応していません。";
render(false);
</script>
